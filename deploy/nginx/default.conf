# ERP web 容器内的 nginx 站点：只服务本项目。
# 宿主 80/443 属于宝塔/其他站点，本项目只在容器内监听 80，由 compose 映射到 127.0.0.1:<ERP_WEB_PORT>。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 容器健康检查端点（不写访问日志）
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 后端 API 反向代理：容器网络内到 api:8000，保留 /api 前缀
    location /api/ {
        # 附件上传（§13.3）：默认上限 10MB，留出 multipart 开销
        client_max_body_size 12m;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Vue Router history 模式 fallback：未知路径回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
