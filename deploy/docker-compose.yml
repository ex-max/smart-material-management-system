# ERP 本地开发数据库：独立 PostgreSQL 实例（仅监听 127.0.0.1:5433）
# 目的：验证 PG 专有行为（jsonb / postgresql_where / COALESCE 表达式唯一索引 / timestamptz）。
# 约束：不碰宿主已有容器（halo / forgejo / forgejo-db / new-api-*），独立卷、独立端口、仅回环。
name: erp

services:
  db:
    image: postgres:16-alpine
    container_name: erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - erp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  erp-pgdata:
