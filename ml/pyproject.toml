[project]
name = "erp-ml"
version = "0.1.0"
description = "智能物资管理系统 ML：数据生成、需求分层、预测基线与库存仿真实验"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "lightgbm>=4.7,<4.8",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# LSTM 对比实验为可选切片：torch 用 CPU 轮子安装，见 make ml-lstm
lstm = ["torch>=2.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["erp_ml*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*joblib will operate in serial mode.*:UserWarning",
]
